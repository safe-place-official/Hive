<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор статей</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ======================= ВЕРХНЯЯ ПАНЕЛЬ ======================= -->
<header class="topbar">
<div class="brand">Редактор</div>
  <div class="actions">
    <button id="btn-new" class="btn">+ Новая статья</button>
    <button id="btn-save" class="btn btn-accent">Сохранить</button>
    <button id="btn-preview" class="btn">Предпросмотр</button>
    <button id="btn-delete" class="btn btn-danger">Удалить</button>
  </div>
</header>

<div class="layout">

  <!-- ======================= СПИСОК СТАТЕЙ ======================= -->
  <aside class="sidebar">
    <h4>Статьи</h4>
    <ul id="articles-list"></ul>
  </aside>

  <!-- ======================= РЕДАКТОР ======================= -->
  <main class="editor">

    <section class="meta">
      <label>Заголовок
        <input id="f-title" type="text" placeholder="Название статьи">
      </label>
      <label>Категория
        <input id="f-category" type="text" placeholder="Unity / Rigidbody">
      </label>
      <label>Дата
        <input id="f-date" type="date">
      </label>
      <label>Обложка
        <div class="cover-row">
          <input id="f-cover-url" type="text" placeholder="/uploads/..." readonly>
          <input id="f-cover-file" type="file" accept="image/*" hidden>
          <button class="btn" id="btn-cover">Загрузить</button>
        </div>
      </label>
    </section>

    <section class="blocks">
      <div id="blocks"></div>
      <div class="add-block">
        <select id="block-type">
          <option value="h2">Заголовок H2</option>
          <option value="h3">Подзаголовок H3</option>
          <option value="p">Абзац текста</option>
          <option value="img">Картинка</option>
          <option value="gif">GIF</option>
          <option value="video">Видео (YouTube/Rutube)</option>
          <option value="audio">Аудио</option>
          <option value="quote">Цитата</option>
          <option value="list">Список</option>
          <option value="code">Код</option>
        </select>
        <button class="btn btn-accent" id="btn-add-block">+ Добавить блок</button>
      </div>
    </section>

    <div id="empty-hint" class="empty-hint">
      Выберите статью слева или создайте новую.
    </div>

  </main>
</div>

<!-- Тост -->
<div id="toast" class="toast"></div>

<!-- Скрытый input для загрузки файлов внутри блоков -->
<input type="file" id="hidden-file-input" hidden>

<script src="editor.js"></script>
</body>
</html>
